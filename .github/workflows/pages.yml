name: Deploy progressive dialer to Pages

on:
  push:
    branches: [1.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/1.x'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTING_URL: https://zocalohealth.github.io/engage-voice-embeddable
      RINGCENTRAL_CLIENT_ID: AOTxVRud21rfkxO6wYxFcR
      RINGCENTRAL_SERVER: https://platform.ringcentral.com
      ENGAGE_VOICE_AUTH_SERVER: https://engage.ringcentral.com
      BUILD_HASH: ${{ github.sha }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --runInBand
      - name: Record build time
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, `WIDGET_BUILD_AT=${new Date().toISOString()}\n`)'
      - run: npm run build
      - run: npm run test:startup
      - name: Record deployed revision
        run: |
          node -e 'require("fs").writeFileSync("build/rc/build-info.json", JSON.stringify({version: require("./package.json").version, commit: process.env.GITHUB_SHA, branch: process.env.GITHUB_REF_NAME, builtAt: process.env.WIDGET_BUILD_AT}))'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/rc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
